{% extends "base.html" %}
{% block content %}
<div class="lessons">
    {% for lesson in lessons %}
        <div class="lesson">
        <h3>{{ lesson.name }}</h2>
        <p>{{ lesson.description }}</p>
        <a href="{{ lesson.url }}">Go to Lesson</a>
        </div>
    {% endfor %}
</div>
{% endblock %}
